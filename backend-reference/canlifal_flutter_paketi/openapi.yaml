components:
  securitySchemes:
    mobileJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Mobil JWT. Authorization: Bearer <accessToken>. Kaynak lib/mobile-auth.ts"
    webSession:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: "Web tarayici oturum cerezi. Flutter bunu KULLANMAZ."
  schemas:
    ErrorPlain:
      type: object
      properties:
        error: { type: string }
    ErrorWrapped:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
    ConfirmationRequired:
      type: object
      description: "§88 kritik işlem onayı — istemci aynı gövdeyi confirm:true ile tekrar gönderir."
      properties:
        requiresConfirmation: { type: boolean, example: true }
        confirmationMessage: { type: string }
        action: { type: string }
  responses:
    Unauthorized:
      description: Oturum yok / token geçersiz
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorPlain" }
    Forbidden:
      description: Yetki yok
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorPlain" }
    NotFound:
      description: Kayıt bulunamadı
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorPlain" }
    Conflict:
      description: Çakışma veya onay gerekli
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ConfirmationRequired" }
    TooManyRequests:
      description: Hız sınırı aşıldı
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorPlain" }
    ServerError:
      description: Sunucu hatası
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorPlain" }
