# Hızlı APK derleme — cache odaklı, yalnızca `flutter build apk --release`.
# Sabit indirme: releases/download/apk-latest/canlifal-mobile-release.apk
#
# workflow_dispatch girişleri:
#   run_cleanup        — Actions artifact/cache temizliği (yavaş, varsayılan kapalı)
#   full_release_notes — CHANGELOG ile tam release notu
#   update_build_doc   — docs/LATEST_APK_BUILD.md commit
#   publish_release    — apk-latest yükleme (manuel çalıştırmada)

name: Build release APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: apk-latest release yükle
        type: boolean
        default: true
      run_cleanup:
        description: Actions artifact/cache temizliği
        type: boolean
        default: false
      full_release_notes:
        description: CHANGELOG ile tam release notu
        type: boolean
        default: false
      update_build_doc:
        description: docs/LATEST_APK_BUILD.md commit
        type: boolean
        default: false
  # main push: CI yeşil olmadan APK derlenmez.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: write

concurrency:
  group: build-apk-${{ github.ref }}
  # Yalnızca ardışık main push iptal eder; manuel RE-RUN devam eden push derlemesini kesmez.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build:
    name: APK
    # workflow_run: yalnızca CI başarılıysa; manuel/tag push her zaman.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: write
    defaults:
      run:
        working-directory: mobile

    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=true
        -Dorg.gradle.parallel=true
        -Dorg.gradle.caching=true
        -Dorg.gradle.configureondemand=true
        -Xmx4g

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Disk alanı aç (runner ön-yüklü gereksiz paketler)
        continue-on-error: true
        timeout-minutes: 2
        working-directory: ${{ github.workspace }}
        run: |
          echo "Önce:"; df -h / | tail -1
          timeout 45s sudo rm -rf /usr/share/dotnet /opt/ghc \
            /usr/local/share/powershell /usr/share/swift /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/node_modules || true
          timeout 30s sudo docker image prune --force || true
          echo "Sonra:"; df -h / | tail -1

      - name: Opsiyonel depolama temizliği
        if: github.event_name == 'workflow_dispatch' && inputs.run_cleanup == true
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          KEEP_RELEASE_TAGS: apk-latest
        run: |
          chmod +x scripts/ci-actions-cleanup.sh
          bash scripts/ci-actions-cleanup.sh

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            mobile/android/**/*.gradle*
            mobile/android/**/gradle-wrapper.properties

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true

      - name: Pub cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            mobile/.dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Gradle build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            mobile/android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Android NDK cache
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk
          key: android-ndk-${{ runner.os }}-flutter-stable
          restore-keys: |
            android-ndk-${{ runner.os }}-

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install Android NDK (nttld)
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Link NDK for Flutter Gradle
        working-directory: ${{ github.workspace }}
        env:
          ANDROID_NDK_VERSION: 27.0.12077973
        run: |
          set -euxo pipefail
          chmod +x scripts/ci-link-android-ndk.sh
          bash scripts/ci-link-android-ndk.sh

      - name: Release signing preflight (secrets)
        working-directory: ${{ github.workspace }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x scripts/ci-release-signing-preflight.sh
          bash scripts/ci-release-signing-preflight.sh

      - name: Release gate
        working-directory: ${{ github.workspace }}
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          ACCEPTANCE_USER_EMAIL: ${{ secrets.ACCEPTANCE_USER_EMAIL }}
          ACCEPTANCE_USER_PASSWORD: ${{ secrets.ACCEPTANCE_USER_PASSWORD }}
          ACCEPTANCE_USER_USERNAME: ${{ secrets.ACCEPTANCE_USER_USERNAME }}
          ACCEPTANCE_HOST_EMAIL: ${{ secrets.ACCEPTANCE_HOST_EMAIL }}
          ACCEPTANCE_HOST_PASSWORD: ${{ secrets.ACCEPTANCE_HOST_PASSWORD }}
          ACCEPTANCE_VIEWER_EMAIL: ${{ secrets.ACCEPTANCE_VIEWER_EMAIL }}
          ACCEPTANCE_VIEWER_PASSWORD: ${{ secrets.ACCEPTANCE_VIEWER_PASSWORD }}
          ACCEPTANCE_ADMIN_EMAIL: ${{ secrets.ACCEPTANCE_ADMIN_EMAIL }}
          ACCEPTANCE_ADMIN_PASSWORD: ${{ secrets.ACCEPTANCE_ADMIN_PASSWORD }}
          ACCEPTANCE_TELLER_EMAIL: ${{ secrets.ACCEPTANCE_TELLER_EMAIL }}
          ACCEPTANCE_TELLER_PASSWORD: ${{ secrets.ACCEPTANCE_TELLER_PASSWORD }}
          ACCEPTANCE_TELLER_ID: ${{ secrets.ACCEPTANCE_TELLER_ID }}
          ACCEPTANCE_TELLER_USER_ID: ${{ secrets.ACCEPTANCE_TELLER_USER_ID }}
          ACCEPTANCE_ADMIN_USERNAME: ${{ secrets.ACCEPTANCE_ADMIN_USERNAME }}
          ACCEPTANCE_TELLER_USERNAME: ${{ secrets.ACCEPTANCE_TELLER_USERNAME }}
        run: |
          bash scripts/acceptance-preflight.sh
          bash scripts/run-release-gate.sh

      - name: Release gate raporu (başarısızlıkta)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-report
          path: |
            docs/RELEASE_GATE_REPORT.md
            docs/RELEASE_GATE_REPORT.json
            docs/ACCEPTANCE_TEST_REPORT.md
            docs/ACCEPTANCE_TEST_REPORT.json
          retention-days: 14

      - name: Firebase google-services.json
        working-directory: ${{ github.workspace }}
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -eux
          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            RAW=$(printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\r')
            TRIMMED=$(printf '%s' "$RAW" | tr -d ' \n\t')
            if [[ "$TRIMMED" == \{* ]]; then
              printf '%s' "$RAW" > mobile/android/app/google-services.json
            else
              # Terminal/komut artığı (~$cat~/b64.txt…), satır sonu ve boşlukları temizle.
              B64=$(printf '%s' "$RAW" | tr -d '\n\r\t ' | sed 's/^[^A-Za-z0-9+\/=]*//; s/[^A-Za-z0-9+\/=]*$//')
              printf '%s' "$B64" | base64 -d > mobile/android/app/google-services.json
            fi
            jq -e '.project_info.project_id' mobile/android/app/google-services.json >/dev/null
            bash scripts/generate-firebase-options.sh
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 not set — skipping Firebase config"
          fi

      - name: Release keystore (Google Sign-In SHA-1 tutarlılığı)
        working-directory: ${{ github.workspace }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x scripts/ci-setup-release-keystore.sh
          bash scripts/ci-setup-release-keystore.sh

      - name: flutter build apk --release (Gate 9)
        run: |
          set -eux
          flutter clean
          DEFINES=""
          if [[ -f android/app/google-services.json ]]; then
            DEFINES=$(bash ../scripts/print-firebase-dart-defines.sh || true)
          fi
          flutter pub get
          # shellcheck disable=SC2086
          flutter build apk --release \
            --split-per-abi \
            --target-platform android-arm,android-arm64,android-x64 \
            --tree-shake-icons \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols \
            $DEFINES
          test -s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/app-release.apk

      - name: Gate 9 — release imza doğrulama
        working-directory: ${{ github.workspace }}
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          chmod +x scripts/verify-release-apk-signature.sh
          bash scripts/verify-release-apk-signature.sh mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Copy APK
        working-directory: ${{ github.workspace }}
        run: |
          cp mobile/build/app/outputs/flutter-apk/app-release.apk canlifal-mobile-release.apk
          ls -lh canlifal-mobile-release.apk
          test -s canlifal-mobile-release.apk

      - name: Sürüm meta
        id: meta
        working-directory: ${{ github.workspace }}
        run: |
          VERSION=$(grep -E '^version:' mobile/pubspec.yaml | head -1 | sed 's/version:[[:space:]]*//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: APK artifact yükle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: canlifal-mobile-release-${{ steps.meta.outputs.version }}
          path: canlifal-mobile-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Release notları (minimal)
        if: always() && steps.meta.outputs.version != ''
        working-directory: ${{ github.workspace }}
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          {
            echo "# Canlifal APK ${VERSION}"
            echo ""
            echo "**İndir:** https://github.com/${{ github.repository }}/releases/download/apk-latest/canlifal-mobile-release.apk"
            echo ""
            echo "Commit: \`${{ github.sha }}\` · Run: ${{ github.run_id }}"
          } > /tmp/release_notes_min.md
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.full_release_notes }}" == "true" ]]; then
            {
              echo ""
              echo "## Bu sürümde (CHANGELOG)"
              echo ""
              bash scripts/extract-changelog-head.sh
            } >> /tmp/release_notes_min.md
          elif [[ "${{ github.ref }}" == "refs/heads/main" && "${{ github.event_name }}" == "workflow_run" ]]; then
            {
              echo ""
              echo "## Bu sürümde (CHANGELOG)"
              echo ""
              bash scripts/extract-changelog-head.sh
            } >> /tmp/release_notes_min.md
          fi

      - name: apk-latest yükle (main)
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_run')
        uses: actions/github-script@v7
        env:
          RELEASE_TITLE: Canlifal APK ${{ steps.meta.outputs.version }}
          NOTES_PATH: /tmp/release_notes_min.md
        with:
          github-token: ${{ secrets.GH_RELEASE_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const tag = 'apk-latest';
            const assetName = 'canlifal-mobile-release.apk';
            const apkPath = path.join(process.env.GITHUB_WORKSPACE, assetName);
            const notes = fs.readFileSync(process.env.NOTES_PATH, 'utf8');
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            if (!fs.existsSync(apkPath) || fs.statSync(apkPath).size === 0) {
              core.setFailed(`APK bulunamadı: ${apkPath}`);
              return;
            }
            core.info(`APK: ${apkPath} (${fs.statSync(apkPath).size} bytes)`);

            let release;
            try {
              const { data } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              release = data;
              core.info(`Mevcut release id=${release.id}`);
            } catch (error) {
              if (error.status !== 404) {
                core.warning(`getReleaseByTag: ${error.status} — create deneniyor`);
              }
              if (error.status === 404 || error.status === 403) {
                try {
                  const { data } = await github.rest.repos.createRelease({
                    owner,
                    repo,
                    tag_name: tag,
                    name: process.env.RELEASE_TITLE,
                    body: notes,
                    target_commitish: context.sha,
                  });
                  release = data;
                  core.info(`Yeni release id=${release.id}`);
                } catch (createError) {
                  if (createError.status === 422) {
                    const { data } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
                    release = data;
                  } else {
                    throw createError;
                  }
                }
              } else {
                throw error;
              }
            }

            for (const asset of release.assets || []) {
              if (asset.name === assetName) {
                core.info(`Eski asset siliniyor: ${asset.id}`);
                await github.rest.repos.deleteReleaseAsset({
                  owner,
                  repo,
                  asset_id: asset.id,
                });
              }
            }

            const apkData = fs.readFileSync(apkPath);
            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: release.id,
              name: assetName,
              data: apkData,
              headers: {
                'content-type': 'application/vnd.android.package-archive',
                'content-length': apkData.length,
              },
            });

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: release.id,
              name: process.env.RELEASE_TITLE,
              body: notes,
            });
            core.info(`apk-latest yüklendi: ${process.env.RELEASE_TITLE}`);

      - name: apk-latest yükle (manuel)
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        uses: actions/github-script@v7
        env:
          RELEASE_TITLE: Canlifal APK ${{ steps.meta.outputs.version }}
          NOTES_PATH: /tmp/release_notes_min.md
        with:
          github-token: ${{ secrets.GH_RELEASE_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const tag = 'apk-latest';
            const assetName = 'canlifal-mobile-release.apk';
            const apkPath = path.join(process.env.GITHUB_WORKSPACE, assetName);
            const notes = fs.readFileSync(process.env.NOTES_PATH, 'utf8');
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            if (!fs.existsSync(apkPath) || fs.statSync(apkPath).size === 0) {
              core.setFailed(`APK bulunamadı: ${apkPath}`);
              return;
            }

            let release;
            try {
              const { data } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              release = data;
            } catch (error) {
              if (error.status === 404 || error.status === 403) {
                try {
                  const { data } = await github.rest.repos.createRelease({
                    owner,
                    repo,
                    tag_name: tag,
                    name: process.env.RELEASE_TITLE,
                    body: notes,
                    target_commitish: context.sha,
                  });
                  release = data;
                } catch (createError) {
                  if (createError.status === 422) {
                    const { data } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
                    release = data;
                  } else {
                    throw createError;
                  }
                }
              } else {
                throw error;
              }
            }

            for (const asset of release.assets || []) {
              if (asset.name === assetName) {
                await github.rest.repos.deleteReleaseAsset({
                  owner,
                  repo,
                  asset_id: asset.id,
                });
              }
            }

            const apkData = fs.readFileSync(apkPath);
            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: release.id,
              name: assetName,
              data: apkData,
              headers: {
                'content-type': 'application/vnd.android.package-archive',
                'content-length': apkData.length,
              },
            });

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: release.id,
              name: process.env.RELEASE_TITLE,
              body: notes,
            });

      - name: Sürüm etiketi (v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: canlifal-mobile-release.apk
          make_latest: true

      - name: docs/LATEST_APK_BUILD.md
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_run')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ${{ github.workspace }}
        run: |
          set -eux
          mkdir -p docs
          {
            echo "# Son APK derlemesi"
            echo ""
            echo "| Alan | Değer |"
            echo "|------|--------|"
            echo "| Sürüm | \`${{ steps.meta.outputs.version }}\` |"
            echo "| Tarih (UTC) | $(date -u +"%Y-%m-%d %H:%M") |"
            echo "| Commit | [\`${{ github.sha }}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) |"
            echo "| İş akışı | [Run ${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
            echo "| APK | [canlifal-mobile-release.apk](https://github.com/${{ github.repository }}/releases/download/apk-latest/canlifal-mobile-release.apk) |"
            echo ""
            echo "## Özellikler"
            echo ""
            bash scripts/extract-changelog-head.sh
            echo ""
            echo "_Bu dosya Build release APK iş akışı tarafından otomatik güncellenir._"
          } > docs/LATEST_APK_BUILD.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/LATEST_APK_BUILD.md
          git diff --staged --quiet || git commit -m "chore(docs): APK derleme bildirimi ${{ steps.meta.outputs.version }}"
          git pull --rebase origin main 2>/dev/null || git pull --no-rebase origin main -X ours || true
          git push origin main 2>/dev/null || true
