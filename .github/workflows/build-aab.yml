# Play Store AAB — manuel CI derlemesi (release keystore secret gerekir).
#
# GitHub → Actions → Build release AAB → Run workflow → dal main
# Artifact: canlifal-release-aab

name: Build release AAB

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Dal (varsayılan main)
        type: string
        default: main

permissions:
  contents: read
  actions: write

concurrency:
  group: build-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile

    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=true
        -Dorg.gradle.parallel=true
        -Dorg.gradle.caching=true
        -Xmx4g

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'main' }}

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            mobile/android/**/*.gradle*
            mobile/android/**/gradle-wrapper.properties

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Firebase google-services (optional)
        working-directory: ${{ github.workspace }}
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -eu
          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            RAW="${GOOGLE_SERVICES_JSON_BASE64}"
            B64=$(printf '%s' "$RAW" | tr -d '\n\r\t ' | sed 's/^[^A-Za-z0-9+\/=]*//; s/[^A-Za-z0-9+\/=]*$//')
            printf '%s' "$B64" | base64 -d > mobile/android/app/google-services.json
            bash scripts/generate-firebase-options.sh
          fi

      - name: Release keystore
        working-directory: ${{ github.workspace }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 yok — AAB release imzası gerekli."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\n\r\t ' | base64 -d \
            > mobile/android/app/release.keystore
          cat > mobile/android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      - name: flutter build appbundle --release
        run: |
          set -eux
          DEFINES=""
          if [[ -f android/app/google-services.json ]]; then
            DEFINES=$(bash ../scripts/print-firebase-dart-defines.sh || true)
          fi
          flutter pub get
          # shellcheck disable=SC2086
          flutter build appbundle --release \
            --tree-shake-icons \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols \
            $DEFINES
          test -s build/app/outputs/bundle/release/app-release.aab

      - name: Verify AAB version
        run: |
          set -eux
          EXPECT_BUILD=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f2)
          EXPECT_NAME=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          ls -lh build/app/outputs/bundle/release/app-release.aab
          echo "AAB versionName=${EXPECT_NAME} versionCode=${EXPECT_BUILD}"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: canlifal-release-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
