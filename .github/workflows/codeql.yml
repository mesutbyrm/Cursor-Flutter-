# CodeQL — yalnızca bu repoda bulunan diller:
#   actions, javascript-typescript (api/), java-kotlin (mobile/android)
# Kaldırıldı: Swift, Ruby, C/C++, Python (kaynak yok veya Flutter odak dışı)
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '34 15 * * 4'

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: java-kotlin
            build-mode: manual
          - language: c-cpp
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            mobile/android/**/*.gradle*
            mobile/android/**/gradle-wrapper.properties

      - name: Setup Flutter
        if: matrix.language == 'java-kotlin'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gradle build cache
        if: matrix.language == 'java-kotlin'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            mobile/android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Android NDK cache
        if: matrix.language == 'java-kotlin'
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk
          key: android-ndk-${{ runner.os }}-flutter-stable
          restore-keys: |
            android-ndk-${{ runner.os }}-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Accept Android licenses
        if: matrix.language == 'java-kotlin'
        working-directory: mobile
        run: yes | flutter doctor --android-licenses || true

      - name: Free disk space for NDK
        if: matrix.language == 'java-kotlin'
        working-directory: ${{ github.workspace }}
        run: |
          chmod +x scripts/ci-free-disk-for-ndk.sh
          bash scripts/ci-free-disk-for-ndk.sh

      - name: Setup Android NDK (nttld)
        if: matrix.language == 'java-kotlin'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Link NDK for Flutter Gradle
        if: matrix.language == 'java-kotlin'
        working-directory: ${{ github.workspace }}
        env:
          ANDROID_NDK_VERSION: 27.0.12077973
        run: |
          set -euxo pipefail
          chmod +x scripts/ci-link-android-ndk.sh
          bash scripts/ci-link-android-ndk.sh

      - name: Build Flutter Android for CodeQL
        if: matrix.language == 'java-kotlin'
        working-directory: mobile
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          set -euxo pipefail

          flutter pub get

          if grep -qE '^[[:space:]]*build_runner:' pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs
          fi

          if [[ ! -f android/gradlew ]]; then
            flutter create --platforms=android .
          fi
          chmod +x android/gradlew
          test -x android/gradlew

          # CodeQL — Gradle derlemesi Java/Kotlin izlerini yakalar (flutter build apk yeterli değil).
          cd android
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
