# CodeQL — yalnızca bu repoda bulunan diller:
#   actions, javascript-typescript (api/), java-kotlin (mobile/android)
# Kaldırıldı: Swift, Ruby, C/C++, Python (kaynak yok veya Flutter odak dışı)
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '34 15 * * 4'

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: java-kotlin
            build-mode: manual
          - language: c-cpp
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            mobile/android/**/*.gradle*
            mobile/android/**/gradle-wrapper.properties

      - name: Setup Flutter
        if: matrix.language == 'java-kotlin'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Accept Android licenses
        if: matrix.language == 'java-kotlin'
        working-directory: mobile
        run: yes | flutter doctor --android-licenses || true

      - name: Build Flutter Android for CodeQL
        if: matrix.language == 'java-kotlin'
        working-directory: mobile
        run: |
          set -euxo pipefail

          flutter pub get

          if grep -qE '^[[:space:]]*build_runner:' pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs
          fi

          if [[ ! -f android/gradlew ]]; then
            flutter create --platforms=android .
          fi
          chmod +x android/gradlew
          test -x android/gradlew

          flutter build apk --debug

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
