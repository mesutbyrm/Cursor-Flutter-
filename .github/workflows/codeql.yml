# CodeQL — Flutter mobil (Android/Kotlin) + API (JS/TS) + Actions.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '34 15 * * 4'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          # Flutter Android — Gradle/Kotlin; otomatik build algılanmaz, manuel APK derlemesi gerekir.
          - language: java-kotlin
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Setup Java 17
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            mobile/android/**/*.gradle*
            mobile/android/**/gradle-wrapper.properties

      - name: Setup Flutter
        if: matrix.language == 'java-kotlin'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept Android licenses
        if: matrix.language == 'java-kotlin'
        working-directory: mobile
        run: yes | flutter doctor --android-licenses || true

      - name: Build Flutter Android for CodeQL
        if: matrix.language == 'java-kotlin'
        working-directory: mobile
        run: |
          set -eux
          flutter pub get
          flutter build apk --debug

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
