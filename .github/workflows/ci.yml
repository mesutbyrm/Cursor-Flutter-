name: CI

permissions:
  contents: read
  statuses: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'api/**'
      - 'scripts/dart-analyze-gate.sh'
      - 'scripts/run-release-gate.sh'
      - 'scripts/acceptance-preflight.sh'
      - 'scripts/faz0-verify.sh'
      - 'scripts/faz0-next.sh'
      - 'scripts/faz0-status.sh'
      - 'scripts/admin-jeton-cheatsheet.sh'
      - 'scripts/m5-preflight.sh'
      - 'scripts/probe-jeton-earn.sh'
      - 'scripts/wait-for-jeton.sh'
      - 'scripts/run-music-acceptance.sh'
      - 'scripts/probe-music-room.sh'
      - 'scripts/acceptance-tests/**'
      - 'mcp-server/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/build-apk.yml'
      - 'scripts/ci-release-gate-summary.sh'
  workflow_dispatch:

# Aynı dalda üst üste koşan işleri iptal et — yalnızca gerçekten başlamış
# eski koşuyu kes (eşzamanlı duplicate push race'inde tüm koşuların iptal
# olmasını önlemek için cancel-in-progress kapalı).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: API + Flutter analyze
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: API — TypeScript derleme
        working-directory: api
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
        run: |
          set -eux
          npm ci
          npx prisma generate
          npm run build

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true

      - name: Flutter — dart analyze (yalnızca ERROR)
        working-directory: ${{ github.workspace }}
        run: |
          set -eux
          chmod +x scripts/dart-analyze-gate.sh
          bash scripts/dart-analyze-gate.sh

      - name: Commit status — Analyze gate
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'Canlifal CI / Analyze',
              description: ok ? 'dart analyze — 0 errors' : 'Analyze gate FAILED',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  flutter-test:
    name: Flutter test gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true

      - name: Flutter clean / pub get / analyze / test
        working-directory: mobile
        run: |
          set -eux
          flutter clean
          flutter pub get
          bash ../scripts/dart-analyze-gate.sh
          flutter test --reporter compact

      - name: Commit status — Flutter test gate
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'Canlifal CI / Flutter tests',
              description: ok ? '994+ tests PASS, 0 analyze errors' : 'Flutter test gate FAILED',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  faz0-music:
    name: FAZ 0 music verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true

      - name: Acceptance secret doğrulama
        continue-on-error: true
        env:
          ACCEPTANCE_USER_EMAIL: ${{ secrets.ACCEPTANCE_USER_EMAIL }}
          ACCEPTANCE_USER_PASSWORD: ${{ secrets.ACCEPTANCE_USER_PASSWORD }}
          ACCEPTANCE_USER_USERNAME: ${{ secrets.ACCEPTANCE_USER_USERNAME }}
          ACCEPTANCE_HOST_EMAIL: ${{ secrets.ACCEPTANCE_HOST_EMAIL }}
          ACCEPTANCE_HOST_PASSWORD: ${{ secrets.ACCEPTANCE_HOST_PASSWORD }}
          ACCEPTANCE_ADMIN_EMAIL: ${{ secrets.ACCEPTANCE_ADMIN_EMAIL }}
          ACCEPTANCE_ADMIN_PASSWORD: ${{ secrets.ACCEPTANCE_ADMIN_PASSWORD }}
          ACCEPTANCE_ADMIN_USERNAME: ${{ secrets.ACCEPTANCE_ADMIN_USERNAME }}
        run: |
          chmod +x scripts/validate-acceptance-secrets.sh
          bash scripts/validate-acceptance-secrets.sh

      - name: FAZ 0 otomatik kapılar (M5 cihaz hariç)
        env:
          # USER/HOST secret verilmez — hatalı secret CI'yı kırmaz; varsayılan test hesabı kullanılır.
          # Secret doğrulama: önceki "Acceptance secret doğrulama" adımı.
          ACCEPTANCE_ADMIN_EMAIL: ${{ secrets.ACCEPTANCE_ADMIN_EMAIL }}
          ACCEPTANCE_ADMIN_PASSWORD: ${{ secrets.ACCEPTANCE_ADMIN_PASSWORD }}
          ACCEPTANCE_ADMIN_USERNAME: ${{ secrets.ACCEPTANCE_ADMIN_USERNAME }}
          JETON_TOPUP_DEBUG: '1'
        run: |
          set -eux
          chmod +x scripts/faz0-verify.sh
          bash scripts/faz0-verify.sh

      - name: Jeton top-up tanı (başarısızlıkta)
        if: always()
        continue-on-error: true
        env:
          ACCEPTANCE_USER_EMAIL: ${{ secrets.ACCEPTANCE_USER_EMAIL }}
          ACCEPTANCE_USER_PASSWORD: ${{ secrets.ACCEPTANCE_USER_PASSWORD }}
          ACCEPTANCE_USER_USERNAME: ${{ secrets.ACCEPTANCE_USER_USERNAME }}
          ACCEPTANCE_ADMIN_EMAIL: ${{ secrets.ACCEPTANCE_ADMIN_EMAIL }}
          ACCEPTANCE_ADMIN_PASSWORD: ${{ secrets.ACCEPTANCE_ADMIN_PASSWORD }}
          ACCEPTANCE_ADMIN_USERNAME: ${{ secrets.ACCEPTANCE_ADMIN_USERNAME }}
          JETON_TOPUP_DEBUG: '1'
        run: |
          set -ux
          chmod +x scripts/debug-jeton-topup.sh
          bash scripts/debug-jeton-topup.sh

      - name: Faz unit testleri (FAZ1–9)
        continue-on-error: true
        run: |
          chmod +x scripts/run-phase-tests.sh
          bash scripts/run-phase-tests.sh

      - name: FAZ0 raporu (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faz0-verify-report
          path: docs/FAZ0_VERIFY_REPORT.md
          retention-days: 14
